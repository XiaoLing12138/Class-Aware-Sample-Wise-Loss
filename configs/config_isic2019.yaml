train:
  size: 224
  cuda: 0
  resume: False
  pretrain: official
  mixed_loss: False
  seed: 96512
  lr: 0.0001
  batch-size: 256
  epochs: 50
  decay: !!float 1e-4
  dataset: isic2019
  data_path: 
  num_worker: 6
  num_classes: 8
  mean:
    - 0.485
    - 0.456
    - 0.406
  std:
    - 0.229
    - 0.224
    - 0.225
model:
  folder: checkpoints/isic2019
  loss_file_1: None
  loss_file_2: None
  loss_caller_1: torch.nn.CrossEntropyLoss()
  loss_caller_2: torch.nn.CrossEntropyLoss()
  alpha: 1.0
  beta: 0.0
  file: resnet
  caller: resnet50(num_classes=config["train"]["num_classes"])
  name: resnet50_ce_50_256
  pretrain: resnet50
log:
  folder: logs/isic2019
